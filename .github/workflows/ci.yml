# CI for the public fair-code open core (github.com/bright-interaction/mesh). Build + vet
# + test + the open-core boundary guard + license headers + a secret scan + govulncheck,
# so a contribution cannot merge if it breaks the build, reaches into the commercial pro
# layer, ships an unlicensed file, or adds a credential.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans the full history, not just the tip

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -count=1

      - name: Open-core boundary (no open package may import a pro package)
        run: bash scripts/check-open-core-boundary.sh

      # Every Go file in this repository is under the Mesh Sustainable Use License, and
      # the header is how a reader (and a downstream packager) knows it. A file without
      # it is either an unlicensed contribution or a file that belongs in the commercial
      # repo instead, and both have happened. One awk pass per file, no network.
      # Covers every source language we ship, not just Go. The header is how a reader
      # and a downstream packager know the licence, and the front-end assets are the
      # files most likely to be lifted out of the repo on their own, so a Go-only check
      # advertised a guarantee narrower than it delivered.
      - name: License headers (SPDX on every source file)
        run: |
          missing=$(git ls-files '*.go' '*.js' '*.css' '*.sql' '*.py' '*.html' '*.sh' | while read -r f; do
            awk 'NR<=5 && /SPDX-License-Identifier: LicenseRef-Mesh-Sustainable-Use-License/ { found=1; exit } END { exit !found }' "$f" \
              || printf '%s\n' "$f"
          done)
          if [ -n "$missing" ]; then
            echo "These files lack the SPDX header 'LicenseRef-Mesh-Sustainable-Use-License' in their first 5 lines:"
            echo "$missing"
            echo "Add it in that file type's comment syntax (// for Go/JS/CSS, -- for SQL, # for Python/shell,"
            echo "<!-- --> for HTML), or the file does not belong here."
            exit 1
          fi
          echo "every tracked source file carries the open SPDX header"

      - name: Secret scan (gitleaks)
        run: |
          go install github.com/zricethezav/gitleaks/v8@latest
          "$(go env GOPATH)/bin/gitleaks" detect --source . --no-banner --redact

      - name: Vulnerability scan (govulncheck)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...
